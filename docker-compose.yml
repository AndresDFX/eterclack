name: eterclack

services:
  # ─────────────────────────────────────────────────────────────
  #  Datos
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eterclack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eterclack_dev}
      POSTGRES_DB: ${POSTGRES_DB:-eterclack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eterclack}"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  # ─────────────────────────────────────────────────────────────
  #  Almacenamiento de fotografías (S3 local)
  # ─────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-eterclack}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-eterclack_dev}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-eterclack}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-eterclack_dev}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb -p local/eterclack-photos &&
      mc mb -p local/eterclack-contracts &&
      mc mb -p local/eterclack-public &&
      mc anonymous set none     local/eterclack-photos &&
      mc anonymous set none     local/eterclack-contracts &&
      mc anonymous set download local/eterclack-public &&
      echo '✓ buckets listos'
      "
    restart: "no"

  # ─────────────────────────────────────────────────────────────
  #  Correo: captura TODO en local, nada sale a internet
  # ─────────────────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # ─────────────────────────────────────────────────────────────
  #  Aplicación
  # ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eterclack}:${POSTGRES_PASSWORD:-eterclack_dev}@postgres:5432/${POSTGRES_DB:-eterclack}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-9000}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      # Los bind mounts de Windows no emiten eventos de archivo:
      # sin polling, tsx watch nunca recarga.
      CHOKIDAR_USEPOLLING: "1"
      CHOKIDAR_INTERVAL: "400"
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./apps/api:/app/apps/api
      - api_node_modules:/app/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules

volumes:
  pgdata:
  redisdata:
  miniodata:
  api_node_modules:
  api_app_node_modules:
  web_node_modules:
  web_app_node_modules:
